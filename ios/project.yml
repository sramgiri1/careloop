name: CareLoop
options:
  bundleIdPrefix: com.careloop
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: com.careloop.ios
    DEVELOPMENT_TEAM: ""
    SDKROOT: auto
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  CareLoop:
    type: application
    platform: iOS
    sources:
      - CareLoop
    settings:
      base:
        INFOPLIST_FILE: CareLoop/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.careloop.ios
        SUPPORTS_MACCATALYST: NO

  CareLoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CareLoopTests
    dependencies:
      - target: CareLoop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.careloop.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CareLoop.app/CareLoop"
        BUNDLE_LOADER: "$(TEST_HOST)"
